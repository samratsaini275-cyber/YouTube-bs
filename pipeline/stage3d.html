<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
  body { font-family: 'Inter', sans-serif; color: #fff; position: relative; }
  canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .ol { -webkit-text-stroke: 14px #10131A; paint-order: stroke fill; }
  #brand { position: absolute; left: 44px; top: 70px; display: flex; align-items: center; gap: 12px;
    font: 800 26px 'Inter'; letter-spacing: .2em; color: #fff; -webkit-text-stroke: 8px #10131A; paint-order: stroke fill; }
  #brand i { width: 18px; height: 18px; background: #FF4D4D; display: inline-block; transform: rotate(45deg); outline: 4px solid #10131A; }
  #label { position: absolute; left: 40px; right: 40px; top: 190px; text-align: center; font: 900 76px/1.05 'Inter'; letter-spacing: -.01em; }
  #note { position: absolute; left: 40px; right: 40px; top: 1420px; text-align: center; font: 800 26px 'Inter'; letter-spacing: .08em;
    -webkit-text-stroke: 7px #10131A; paint-order: stroke fill; }
  #cap { position: absolute; left: 50px; right: 50px; top: 1180px; height: 220px; display: flex; align-items: center; justify-content: center;
    text-align: center; font: 900 82px/1.1 'Inter'; letter-spacing: -.01em; }
  #cap span { display: inline-block; margin: 0 .13em; }
  #cap span.on { color: #FFD21F; }
  #hook { position: absolute; left: 40px; right: 40px; top: 520px; height: 520px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; font: 900 120px/1.03 'Inter'; letter-spacing: -.02em; -webkit-text-stroke: 20px #10131A; paint-order: stroke fill; }
  #h2 { color: #FFD21F; margin-top: 14px; }
  #bar { position: absolute; left: 0; top: 0; height: 8px; background: #FFD21F; }
  #quiz { position: absolute; left: 60px; right: 60px; top: 300px; display: none; flex-direction: column; gap: 26px; }
  #quiz .q { font: 900 66px/1.08 'Inter'; text-align: center; margin-bottom: 18px; -webkit-text-stroke: 14px #10131A; paint-order: stroke fill; }
  #quiz .kicker { font: 800 30px 'Inter'; letter-spacing: .22em; color: #FFD21F; text-align: center; -webkit-text-stroke: 8px #10131A; paint-order: stroke fill; }
  #quiz .opt { display: flex; align-items: center; gap: 26px; background: #10131A; border: 6px solid #fff; border-radius: 28px; padding: 26px 30px; font: 800 52px 'Inter'; }
  #quiz .opt b { flex: none; width: 84px; height: 84px; border-radius: 50%; background: #FFD21F; color: #10131A; display: flex; align-items: center; justify-content: center; font: 900 54px 'Inter'; }
  #quiz .cta { margin-top: 26px; align-self: center; background: #FF4D4D; border: 6px solid #10131A; border-radius: 999px; padding: 22px 48px; font: 900 48px 'Inter'; letter-spacing: .02em; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="brand"><i></i>FAILURE POINT</div>
<div id="label" class="ol"></div>
<div id="hook"><div id="h1"></div><div id="h2"></div></div>
<div id="cap" class="ol"></div>
<div id="note"></div>
<div id="quiz"></div>
<div id="flash"></div>
<div id="bar"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { h } from './lib.js';

const q = new URLSearchParams(location.search);
const ep = (await import('../episodes/' + q.get('ep') + '.js')).default;
const tl = await (await fetch(q.get('tl'))).json();

// ---- renderer ---------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.1, 4000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.5);
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
scene.add(hemi, sun, sun.target);

// ---- modelling kit handed to episodes ---------------------------------------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.6, metalness: o.metal ?? 0,
  emissive: o.glow ? color : 0x000000, emissiveIntensity: o.glow ?? 0, transparent: o.opacity !== undefined, opacity: o.opacity ?? 1,
  side: o.double ? THREE.DoubleSide : THREE.FrontSide, flatShading: !!o.flat });
const mesh = (geo, m, pos = [0, 0, 0], parent = scene) => { const x = new THREE.Mesh(geo, m); x.position.set(...pos); x.castShadow = x.receiveShadow = true; parent.add(x); return x; };
const k = {
  THREE, scene, camera, h, mat, mesh,
  group: (pos = [0, 0, 0], parent = scene) => { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; },
  box: (w, hh, d, m, pos, parent) => mesh(new THREE.BoxGeometry(w, hh, d), m, pos, parent),
  cyl: (r1, r2, hh, m, pos, parent, seg = 40) => mesh(new THREE.CylinderGeometry(r1, r2, hh, seg), m, pos, parent),
  cone: (r, hh, m, pos, parent, seg = 40) => mesh(new THREE.ConeGeometry(r, hh, seg), m, pos, parent),
  ball: (r, m, pos, parent) => mesh(new THREE.SphereGeometry(r, 32, 20), m, pos, parent),
  torus: (r, tube, m, pos, parent) => { const x = mesh(new THREE.TorusGeometry(r, tube, 20, 64), m, pos, parent); x.rotation.x = Math.PI / 2; return x; },
  ground: (color, y = 0, size = 3000) => { const g = mesh(new THREE.PlaneGeometry(size, size), mat(color, { rough: 1 }), [0, y, 0]); g.rotation.x = -Math.PI / 2; g.castShadow = false; return g; },
  // light rig follows the subject so shadows stay sharp wherever the shot is
  light: (target, dist = 60) => { sun.target.position.set(...target); sun.position.set(target[0] + dist * .5, target[1] + dist, target[2] + dist * .7);
    const c = sun.shadow.camera; c.left = c.bottom = -dist; c.right = c.top = dist; c.near = 1; c.far = dist * 4; c.updateProjectionMatrix(); },
  fade: (obj, a) => obj.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = a; } o.visible = a > 0.01; }),
};
const world = ep.setup(k);

// ---- overlay ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
$('h1').textContent = ep.hook[0]; $('h2').textContent = ep.hook[1];
$('hook').style.fontSize = Math.min(120, 960 / (Math.max(ep.hook[0].length, ep.hook[1].length) * 0.66)) + 'px';
const HOOK = 1.9, v = (a) => new THREE.Vector3(...a);

window.renderFrame = (t) => {
  let i = tl.scenes.findIndex(s => t < s.end);
  if (i < 0) i = tl.scenes.length - 1;
  const s = tl.scenes[i], sc = ep.scenes[i];
  const local = Math.max(0, t - s.start), p = h.clamp(local / (s.end - s.start));

  // every scene is a new shot: its own angle, lens, sky colour, and a slow camera move
  const c = sc.cam, e = h.ease(p), to = c.to || {};
  camera.position.copy(v(c.pos).lerp(v(to.pos || c.pos), e));
  const look = v(c.look).lerp(v(to.look || c.look), e);
  if (sc.shake) { const a = sc.shake(local); camera.position.x += h.noise(t * 7) * a; camera.position.y += h.noise(t * 9, 2) * a; }
  camera.up.set(...(c.up || [0, 1, 0])); camera.lookAt(look);
  camera.fov = h.lerp(c.fov || 40, to.fov || c.fov || 40, e); camera.updateProjectionMatrix();
  scene.background = new THREE.Color(sc.sky || '#DAD7CE');
  k.light(sc.lightAt || c.look, sc.lightDist || 60);
  for (const key in world) if (world[key] && world[key].isObject3D && world[key].parent === scene) world[key].visible = !sc.show || sc.show.includes(key);
  if (sc.update) sc.update(world, p, local, k);
  renderer.render(scene, camera);

  // top label (can change during the scene)
  const lab = typeof sc.label === 'function' ? sc.label(local, p) : sc.label;
  $('label').innerHTML = lab ? esc(lab).replace(/\*(.+?)\*/g, '<span style="color:#FFD21F">$1</span>') : '';
  $('note').textContent = (typeof sc.note === 'function' ? sc.note(local) : sc.note) || '';

  const hk = 1 - h.ease(h.clamp((t - HOOK) / 0.3)), pop = h.out(h.clamp(t / 0.16));
  $('hook').style.opacity = hk; $('hook').style.transform = `translateY(${(1 - hk) * -60}px) scale(${1.18 - 0.18 * pop})`;
  $('label').style.opacity = 1 - hk;
  // white flash on each cut, like a camera change
  $('flash').style.opacity = i > 0 ? 0.55 * (1 - h.clamp(local / 0.12)) : 0;

  // closing question: multiple choice, answered in the comments (the answer is never shown on screen)
  const quiz = $('quiz');
  if (sc.quiz) {
    const show = (a, b) => h.out(h.clamp((p - a) / (b - a)));
    quiz.style.display = 'flex';
    quiz.innerHTML = `<div class="kicker" style="opacity:${show(0, .05)}">QUICK QUESTION</div><div class="q" style="opacity:${show(.02, .1)}">${esc(sc.quiz.q)}</div>` +
      sc.quiz.options.map((o, n) => { const a = show(.34 + n * .16, .40 + n * .16); return `<div class="opt" style="opacity:${a};transform:translateX(${(1 - a) * 80}px)"><b>${'ABC'[n]}</b>${esc(o)}</div>`; }).join('') +
      `<div class="cta" style="opacity:${show(.84, .9)};transform:scale(${1 + .04 * Math.sin(t * 9)})">COMMENT A, B OR C</div>`;
    $('label').innerHTML = ''; $('note').textContent = '';
  } else quiz.style.display = 'none';

  const ch = sc.quiz ? null : tl.chunks.find(c => t >= c.start - 0.05 && t < c.end);
  if (ch) {
    $('cap').innerHTML = ch.words.map(w => `<span class="${t >= w.start && t < w.end ? 'on' : ''}">${esc(w.text)}</span>`).join('');
    const total = ch.words.reduce((n, w) => n + w.text.length + 1, 0);
    $('cap').style.fontSize = (total > 26 ? 64 : total > 20 ? 72 : 82) + 'px';
    $('cap').style.transform = `scale(${0.94 + 0.06 * h.out(h.clamp((t - ch.start + 0.05) / 0.12))})`;
  } else $('cap').innerHTML = '';
  $('bar').style.width = (100 * t / tl.duration) + '%';
};
await document.fonts.ready;
window.renderFrame(0);
window.ready = true;
</script>
</body>
</html>
