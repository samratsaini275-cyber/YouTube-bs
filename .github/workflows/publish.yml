# Posts episodes to YouTube Shorts with the official YouTube Data API.
# Secrets needed (Settings > Secrets and variables > Actions): YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
#
# When it runs:
#   - push:     as soon as a new video (videos/*.mp4) lands on the default branch, every unposted
#               episode is uploaded publicly, oldest first, until YouTube's upload limit stops it.
#   - schedule: once a day, posts the next unposted episode (only if the repository variable
#               YT_AUTOPOST is "true"). This works through any backlog left by the upload limit.
#   - manual:   Actions > Publish to YouTube > Run workflow, with a privacy and count of your choice.
name: Publish to YouTube
on:
  # Automatic triggers (push, schedule) are off: they uploaded episodes 009-018 a second time on
  # 2026-11-12 alongside the cloud session's daily upload task. Uploads now run only from that task,
  # or from a manual run here.
  workflow_dispatch:
    inputs:
      privacy:
        description: Who can see the upload
        type: choice
        options: [private, unlisted, public]
        default: private
      count:
        description: How many episodes to post
        default: "1"
permissions:
  contents: write
# Never run two uploads at once, so the same episode cannot be posted twice.
concurrency:
  group: publish-youtube
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'schedule' && vars.YT_AUTOPOST == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
          YT_COUNT: ${{ inputs.count || (github.event_name == 'push' && '100' || '1') }}
        run: python3 pipeline/publish_youtube.py
      # Runs even if the upload step failed part-way (e.g. upload limit), so videos that did
      # go up are still recorded and never uploaded twice.
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channel/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Record YouTube upload"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
